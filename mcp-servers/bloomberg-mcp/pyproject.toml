[project]
name = "bloomberg-mcp"
version = "0.1.0"
description = "MCP server for Bloomberg Data License last prices"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=1.28,<2",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bloomberg_mcp"]
