mcp_servers:
  google_drive:
    transport: stdio
    command: /usr/bin/node
    args:
      - /opt/mcp/google-drive-mcp/dist/index.js
    env:
      GOOGLE_DRIVE_OAUTH_CREDENTIALS: /config/gcp-oauth.keys.json
      GOOGLE_DRIVE_MCP_TOKEN_PATH: /config/tokens.json
    allowed_tools:
      - search
      - listFolder
      - createFolder
      - createTextFile
      - updateTextFile
      - readTextFile
      - deleteItem
      - renameItem
      - moveItem
      - copyFile
      - getFileMetadata
      - exportFile
      - downloadFile
      - uploadFile
      - shareFile
      - removePermission
      - readGoogleDoc
      - createGoogleDoc
      - updateGoogleDoc
      - getGoogleDocContent
      - appendToDoc
      - insertTextInDoc
      - deleteTextInDoc
      - replaceTextInDoc
      - formatGoogleDocRange
      - readGoogleSheet
      - createGoogleSheet
      - updateGoogleSheet
      - getGoogleSheetContent
      - createGoogleSlides
      - updateGoogleSlides