mcp_servers:
  google_drive:
    transport: stdio
    command: /usr/bin/node
    args:
      - /app/mcp/google-drive-mcp/dist/index.js
    env:
      GOOGLE_DRIVE_OAUTH_CREDENTIALS: /config/gcp-oauth.keys.json
      GOOGLE_DRIVE_MCP_TOKEN_PATH: /config/tokens.json
    allowed_tools:
      - search
      - listFolder
      - createFolder
      - createTextFile
      - readTextFile
      - copyFile
      - getFileMetadata
      - readGoogleDoc
      - createGoogleDoc
      - getGoogleDocContent
      - appendToDoc
      - insertTextInDoc
      - readGoogleSheet
      - createGoogleSheet
      - getGoogleSheetContent
      - createGoogleSlides

  FIGMA:
    transport: stdio
    command: /usr/bin/node
    args:
      - /opt/mcp/figma-mcp/dist/bin.js
      - --stdio
    env:
      FIGMA_API_KEY: os.environ/FIGMA_API_KEY
    allowed_tools:
      - get_figma_data
      - download_figma_images
