mcp_servers:
  Slack:
    transport: http
    url: "http://127.0.0.1:8000/mcp"
    auth_type: oauth2
    oauth2_flow: authorization_code
    issuer: https://mcp.slack.com
    client_id: os.environ/SLACK_CLIENT_ID
    client_secret: os.environ/SLACK_CLIENT_SECRET
    # User-token scopes, limited to what the allowed tools below need. The proxy confines every
    # channel-naming call, writes included, to channels.txt; DMs and channel creation stay off.
    scopes:
      - search:read.public
      - search:read.users
      - channels:read
      - channels:history
      - files:read
      - users:read
      - chat:write
      - reactions:write
    available_on_public_internet: false
    allow_all_keys: false
    allowed_tools:
      - slack_search_public
      - slack_read_channel
      - slack_read_thread
      - slack_list_channel_members
      - slack_read_file
      - slack_search_users
      - slack_message_self
      - slack_send_message
      - slack_send_message_draft
      - slack_schedule_message
      - slack_add_reaction
  Dropbox:
    transport: http
    url: "https://mcp.dropbox.com/mcp"
    auth_type: oauth2
    oauth2_flow: authorization_code
    # Dropbox only allows dynamic client registration for its own allowlist of clients, so the gateway presents
    # the operator's own Dropbox app. token_access_type=offline is what makes Dropbox return a refresh token.
    authorization_url: https://www.dropbox.com/oauth2/authorize?token_access_type=offline
    token_url: https://api.dropboxapi.com/oauth2/token
    client_id: os.environ/DROPBOX_CLIENT_ID
    client_secret: os.environ/DROPBOX_CLIENT_SECRET
    scopes:
      - account_info.read
      - files.metadata.read
      - files.content.read
    available_on_public_internet: false
    allow_all_keys: false
    # Read-only. Shared-link and download-link tools stay off so files are never exposed outside Dropbox's own access
    # controls.
    allowed_tools:
      - WhoAmI
      - Search
      - ListFolder
      - GetFileMetadata
      - GetFileContent
      - GetMarkdown
      - ListFileRevisions
